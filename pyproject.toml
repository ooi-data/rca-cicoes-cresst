[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-cicoes-cresst"
version = "0.1.0"
description = "QAQC'd data products from OOI Regional Cabled Array profiler moorings for CICOES/CRESST modelers"
requires-python = ">=3.10"
dependencies = [
    "s3fs",
    "xarray",
    "zarr",
    "numpy",
    "pandas",
    "loguru",
    "tqdm",
    "click",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
curate = ["anthropic"]
viz = ["cmocean", "hvplot"]
review = ["streamlit>=1.65,<2"]

[project.scripts]
regrid-profiler = "rca_cicoes_cresst.regrid_profiler:main"
fixed-instruments = "rca_cicoes_cresst.fixed_instruments:main"
bin-dataset = "rca_cicoes_cresst.bin_dataset:main"
sync-cresst = "rca_cicoes_cresst.sync_products:main"
release-cresst = "rca_cicoes_cresst.release:main"
harvest-annotations = "rca_cicoes_cresst.harvest_annotations:main"
curate-annotations = "rca_cicoes_cresst.curate:main"
review-annotations = "rca_cicoes_cresst.review:main"

[tool.setuptools]
packages = ["rca_cicoes_cresst"]
